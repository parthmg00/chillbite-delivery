services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: chillbite-backend

    env_file:
      - ./.env.docker

    ports:
      - "5000:5000"

    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules

    dns:
      - 8.8.8.8
      - 1.1.1.1

    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: chillbite-frontend

    environment:
      VITE_API_URL: http://localhost:5000/api

    ports:
      - "5173:5173"

    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

    depends_on:
      - backend

    restart: unless-stopped

volumes:
  backend_node_modules:
  frontend_node_modules: